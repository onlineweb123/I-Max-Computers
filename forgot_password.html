<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - i-Max Computers</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            padding: 35px 24px;
            text-align: center;
        }

        .header-container {
            margin-bottom: 24px;
        }

        .title {
            color: #0288d1;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: #78909c;
            font-size: 13px;
            margin-top: 8px;
            line-height: 1.4;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #455a64;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #cfd8dc;
            border-radius: 14px;
            font-size: 14px;
            color: #263238;
            outline: none;
            background-color: #ffffff;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: #0288d1;
        }

        .form-control::placeholder {
            color: #b0bec5;
        }

        .form-control:disabled {
            background-color: #f0f4f8;
            color: #78909c;
            cursor: not-allowed;
        }

        .error-msg {
            color: #e53935;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(180deg, #0288d1 0%, #01579b 100%);
            border: none;
            border-radius: 16px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 16px rgba(2, 136, 209, 0.28);
            transition: opacity 0.2s ease;
        }

        .btn-submit:active {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-update {
            background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%);
            box-shadow: 0 6px 16px rgba(46, 125, 50, 0.28);
        }

        .reset-section {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #cfd8dc;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #78909c;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #0288d1;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-container">
            <h1 class="title">Reset Password</h1>
            <p class="subtitle">Enter your details to recover your account..</p>
        </div>

        <!-- VERIFICATION FORM (STEP 1) -->
        <form id="verifyForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="verifyUsername" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="verifyPhone" class="form-control" placeholder="Registered phone number" maxlength="10" required>
                <div class="error-msg" id="phoneError">Please enter a valid 10-digit phone number!</div>
            </div>
            <button type="submit" id="verifyBtn" class="btn-submit">
                <span class="spinner" id="verifySpinner"></span>
                <span id="verifyBtnText">Verify Details</span>
            </button>
        </form>

        <!-- NEW PASSWORD FORM (STEP 2) -->
        <form id="resetForm" class="reset-section">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required>
                <div class="error-msg" id="passMatchError">Passwords do not match!</div>
            </div>
            <button type="submit" id="updateBtn" class="btn-submit btn-update">
                <span class="spinner" id="updateSpinner"></span>
                <span id="updateBtnText">Update Password</span>
            </button>
        </form>

        <a href="login.html" class="back-link">&larr; Back to Login</a>
    </div>

    <!-- FIREBASE SDK & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getDatabase, ref, get, update, child } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDHSiV0Y5zpzSI2fBeho7WnofFHyR2a3eo",
            authDomain: "i-max-computers.firebaseapp.com",
            databaseURL: "https://i-max-computers-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "i-max-computers",
            storageBucket: "i-max-computers.firebasestorage.app",
            messagingSenderId: "654132099212",
            appId: "1:654132099212:web:ed3222b2c80efed5bf23a9"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let verifiedUser = "";

        // STEP 1: VERIFY USERNAME & PHONE NUMBER
        document.getElementById('verifyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('verifyUsername').value.trim();
            const phone = document.getElementById('verifyPhone').value.trim();
            const phoneError = document.getElementById('phoneError');

            if (!/^[0-9]{10}$/.test(phone)) {
                phoneError.style.display = 'block';
                return;
            } else {
                phoneError.style.display = 'none';
            }

            setLoading('verify', true);

            const dbRef = ref(database);
            get(child(dbRef, 'users/' + username)).then((snapshot) => {
                setLoading('verify', false);
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    if (userData.phone === phone) {
                        alert('User Verified! Now enter your new password.');
                        verifiedUser = username;

                        // Lock Step 1 Inputs
                        document.getElementById('verifyUsername').disabled = true;
                        document.getElementById('verifyPhone').disabled = true;
                        document.getElementById('verifyBtn').disabled = true;
                        document.getElementById('verifyBtnText').innerText = 'Verified ✓';

                        // Show Step 2
                        document.getElementById('resetForm').style.display = 'block';
                    } else {
                        alert('Phone number does not match registered user details!');
                    }
                } else {
                    alert('Username not found!');
                }
            }).catch((error) => {
                setLoading('verify', false);
                alert('An error occurred: ' + error.message);
            });
        });

        // STEP 2: UPDATE PASSWORD
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const passMatchError = document.getElementById('passMatchError');

            if (newPassword !== confirmPassword) {
                passMatchError.style.display = 'block';
                return;
            } else {
                passMatchError.style.display = 'none';
            }

            setLoading('update', true);

            const updates = {};
            updates['/users/' + verifiedUser + '/password'] = newPassword;

            update(ref(database), updates).then(() => {
                setLoading('update', false);
                alert('Password updated successfully! Please login with your new password.');
                window.location.href = 'login.html';
            }).catch((error) => {
                setLoading('update', false);
                alert('An error occurred while updating: ' + error.message);
            });
        });

        // HELPER: SPINNER CONTROL
        function setLoading(formType, isLoading) {
            const btn = document.getElementById(formType + 'Btn');
            const spinner = document.getElementById(formType + 'Spinner');
            const text = document.getElementById(formType + 'BtnText');

            if (isLoading) {
                btn.disabled = true;
                spinner.style.display = 'inline-block';
                text.style.opacity = '0.7';
            } else {
                btn.disabled = false;
                spinner.style.display = 'none';
                text.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
